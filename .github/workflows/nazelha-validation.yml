name: Nazelha validation

on:
  push:
    branches:
      - feature/direct-http-downloads-stage1-2026-10-27
      - release/nazelha-1.0.9-official-2026-10-30
    tags:
      - 'nazelha-preview-v*'
      - 'nazelha-v*'
  pull_request:
    branches:
      - feature/direct-http-downloads-stage1-2026-10-27
      - release/nazelha-1.0.9-official-2026-10-30
  workflow_dispatch:

permissions:
  contents: read

env:
  NAZELHA_EXPECTED_RELEASE_CERT_SHA256: "87d073044514598d52a66c5c6351d16c110b1b39ac31caa3b7e711c1856ca99d"
  NAZELHA_EXPECTED_PRODUCTION_CERT_SHA256: "23149d2b625f1b6f344d585ac6c0a84ac2672059d1cb96499947261403370450"

concurrency:
  group: nazelha-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Nazelha
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run unit tests, compile Android tests, and lint
        env:
          NAZELHA_LIVE_HTTP_TESTS: '1'
        run: >-
          ./gradlew
          :app:testGithubPreviewDebugUnitTest
          :app:compileGithubPreviewDebugAndroidTestKotlin
          :app:lintGithubPreviewDebug
          :app:lintGenericRelease
          -PnoSplits
          -PABI_FILTERS=arm64-v8a
          --no-daemon
          --no-configuration-cache
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
          --stacktrace

      - name: Assemble ARM64 debug APK for branch validation
        if: startsWith(github.ref, 'refs/heads/')
        run: >-
          ./gradlew
          :app:assembleGithubPreviewDebug
          -PnoSplits
          -PABI_FILTERS=arm64-v8a
          --no-daemon
          --no-configuration-cache
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
          --stacktrace

      - name: Verify debug validation APK identity, ABI, and size profile
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/githubPreview/debug -name '*.apk' -print -quit)
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-verification.txt
          "$tools/aapt" dump badging "$apk" >> apk-verification.txt
          grep -q "package: name='com.snapnet.preview.debug'" apk-verification.txt
          grep -q "versionCode='100110402' versionName='1.0.11-debug'" apk-verification.txt
          grep -q "application-label:'نزّلها — فيديو وملفات'" apk-verification.txt
          grep -Eq 'certificate SHA-256 digest: [[:xdigit:]]{64}$' apk-verification.txt
          test -s app/build/outputs/mapping/githubPreviewDebug/mapping.txt
          python3 - "$apk" <<'PY'
          import collections, hashlib, json, os, sys, zipfile
          apk=sys.argv[1]
          baseline_bytes=87638100
          baseline_sha256='76ff9002fee77f07c38ecc584b8a0b6b52247dbdd763e1312cb0d9a4b747b63c'
          with zipfile.ZipFile(apk) as z:
              entries=[i for i in z.infolist() if not i.is_dir()]
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
              assert abis == ['arm64-v8a'], abis
              top=sorted(entries, key=lambda i:i.compress_size, reverse=True)[:30]
              native=collections.defaultdict(int)
              components=collections.defaultdict(int)
              for i in entries:
                  if i.filename.startswith('lib/'):
                      native[i.filename.split('/')[2]] += i.compress_size
                      component='native_libraries'
                  elif i.filename.endswith('.dex'):
                      component='dex'
                  elif i.filename == 'resources.arsc':
                      component='resource_table'
                  elif i.filename.startswith('res/'):
                      component='res_resources'
                  else:
                      component='other'
                  components[component] += i.compress_size
          apk_bytes=os.path.getsize(apk)
          digest=hashlib.sha256()
          with open(apk,'rb') as source:
              for chunk in iter(lambda: source.read(1024*1024), b''):
                  digest.update(chunk)
          component_profile={
              key:{'compressed_bytes':value,'percent_of_apk':round(value*100/apk_bytes,2)}
              for key,value in sorted(components.items())
          }
          report={
              'apk': os.path.basename(apk),
              'apk_bytes': apk_bytes,
              'sha256': digest.hexdigest(),
              'abi': abis,
              'baseline_v1_0_6': {'apk_bytes':baseline_bytes,'sha256':baseline_sha256},
              'size_change_vs_v1_0_6': {
                  'bytes':apk_bytes-baseline_bytes,
                  'percent':round((apk_bytes-baseline_bytes)*100/baseline_bytes,2),
                  'negative_means_smaller':True,
              },
              'component_profile': component_profile,
              'native_libraries_compressed_bytes': dict(sorted(native.items(), key=lambda x:x[1], reverse=True)),
              'largest_entries': [{'path':i.filename,'compressed_bytes':i.compress_size,'expanded_bytes':i.file_size} for i in top],
              }
          with open('apk-size-profile.json','w') as f:
              json.dump(report,f,indent=2)
              f.write('\n')
          print(json.dumps(report,indent=2))
          PY
          sha256sum "$apk" > "$apk.sha256"

      - name: Prepare the permanent Nazelha production signing key
        if: startsWith(github.ref, 'refs/tags/nazelha-v')
        shell: bash
        env:
          NAZELHA_PRODUCTION_SIGNING_KEYSTORE_BASE64: ${{ secrets.NAZELHA_PRODUCTION_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NAZELHA_PRODUCTION_SIGNING_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/nazelha-production-release.jks"
          printf '%s' "$NAZELHA_PRODUCTION_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          printf 'NAZELHA_PRODUCTION_KEYSTORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build minified signed official ARM64 APK
        if: startsWith(github.ref, 'refs/tags/nazelha-v')
        env:
          NAZELHA_PRODUCTION_STORE_PASSWORD: ${{ secrets.NAZELHA_PRODUCTION_STORE_PASSWORD }}
          NAZELHA_PRODUCTION_KEY_ALIAS: ${{ secrets.NAZELHA_PRODUCTION_KEY_ALIAS }}
          NAZELHA_PRODUCTION_KEY_PASSWORD: ${{ secrets.NAZELHA_PRODUCTION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAZELHA_PRODUCTION_STORE_PASSWORD"
          test -n "$NAZELHA_PRODUCTION_KEY_ALIAS"
          test -n "$NAZELHA_PRODUCTION_KEY_PASSWORD"
          ./gradlew \
            :app:assembleGenericRelease \
            -PnoSplits \
            -PABI_FILTERS=arm64-v8a \
            -PnazelhaRequireProductionSigning=true \
            --max-workers=2 \
            --no-daemon \
            --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify official APK identity, ABI, signing certificate, and profile
        if: startsWith(github.ref, 'refs/tags/nazelha-v')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/generic/release -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > official-verification.txt
          debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$apk")
          test "$debuggable" = "false"
          printf 'APK debuggable: %s\n' "$debuggable" >> official-verification.txt
          "$tools/aapt" dump badging "$apk" >> official-verification.txt
          grep -q "package: name='com.hoodmoshla.nazelha'" official-verification.txt
          grep -q "versionCode='100110402' versionName='1.0.11'" official-verification.txt
          grep -q "application-label:'نزّلها — فيديو وملفات'" official-verification.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" official-verification.txt
          grep -Fxq 'APK debuggable: false' official-verification.txt
          digest_line=$(grep -i -m1 'certificate SHA-256 digest:' official-verification.txt)
          digest=${digest_line#*digest: }
          digest=${digest//:/}
          digest=$(printf '%s' "$digest" | tr '[:upper:]' '[:lower:]')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test "$digest" = "$NAZELHA_EXPECTED_PRODUCTION_CERT_SHA256"
          printf 'Verified production certificate SHA-256 (normalized): %s\n' "$digest" >> official-verification.txt
          test -s app/build/outputs/mapping/genericRelease/mapping.txt
          python3 - "$apk" <<'PY'
          import hashlib, json, os, sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              abis=sorted({path.split('/')[1] for path in archive.namelist() if path.startswith('lib/') and path.endswith('.so')})
          assert abis == ['arm64-v8a'], abis
          digest=hashlib.sha256()
          with open(apk,'rb') as source:
              for chunk in iter(lambda: source.read(1024*1024), b''):
                  digest.update(chunk)
          report={'apk':os.path.basename(apk),'apk_bytes':os.path.getsize(apk),'sha256':digest.hexdigest(),'abi':abis,'application_id':'com.hoodmoshla.nazelha','version_name':'1.0.11','version_code':100110402}
          with open('official-apk-size-profile.json','w') as output:
              json.dump(report,output,indent=2)
              output.write('\n')
          print(json.dumps(report,indent=2))
          PY
          sha256sum "$apk" > "$apk.sha256"

      - name: Retain the verified official ARM64 APK and reports
        if: startsWith(github.ref, 'refs/tags/nazelha-v')
        uses: actions/upload-artifact@v4
        with:
          name: Nazelha-official-arm64-release
          path: |
            app/build/outputs/apk/generic/release/*.apk
            app/build/outputs/apk/generic/release/*.apk.sha256
            app/build/outputs/mapping/genericRelease/mapping.txt
            official-verification.txt
            official-apk-size-profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare the persistent Nazelha preview signing key
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        shell: bash
        env:
          NAZELHA_SIGNING_KEYSTORE_BASE64: ${{ secrets.NAZELHA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NAZELHA_SIGNING_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/nazelha-preview-release.jks"
          printf '%s' "$NAZELHA_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          printf 'NAZELHA_KEYSTORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Build minified signed ARM64 preview distribution
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        env:
          NAZELHA_STORE_PASSWORD: ${{ secrets.NAZELHA_RELEASE_STORE_PASSWORD }}
          NAZELHA_KEY_ALIAS: ${{ secrets.NAZELHA_RELEASE_KEY_ALIAS }}
          NAZELHA_KEY_PASSWORD: ${{ secrets.NAZELHA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAZELHA_STORE_PASSWORD"
          test -n "$NAZELHA_KEY_ALIAS"
          test -n "$NAZELHA_KEY_PASSWORD"
          ./gradlew \
            :app:assembleGithubPreviewDistribution \
            -PnoSplits \
            -PABI_FILTERS=arm64-v8a \
            -PnazelhaRequirePreviewSigning=true \
            --no-daemon \
            --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify signed ARM64 preview distribution identity, certificate, and size
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/githubPreview/distribution -name '*.apk' -print -quit)
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > preview-verification.txt
          debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$apk")
          test "$debuggable" = "false"
          printf 'APK debuggable: %s\n' "$debuggable" >> preview-verification.txt
          "$tools/aapt" dump badging "$apk" >> preview-verification.txt
          grep -q "package: name='com.snapnet.preview.debug'" preview-verification.txt
          grep -q "versionCode='100110402' versionName='1.0.11-preview'" preview-verification.txt
          grep -q "application-label:'نزّلها — فيديو وملفات'" preview-verification.txt
          digest_line=$(grep -i -m1 'certificate SHA-256 digest:' preview-verification.txt)
          digest=${digest_line#*digest: }
          digest=${digest//:/}
          digest=$(printf '%s' "$digest" | tr '[:upper:]' '[:lower:]')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test "$digest" = "$NAZELHA_EXPECTED_RELEASE_CERT_SHA256"
          printf 'Verified certificate SHA-256 (normalized): %s\n' "$digest" >> preview-verification.txt
          test -s app/build/outputs/mapping/githubPreviewDistribution/mapping.txt
          python3 - "$apk" <<'PY'
          import collections, hashlib, json, os, sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              entries=[i for i in z.infolist() if not i.is_dir()]
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
              assert abis == ['arm64-v8a'], abis
              components=collections.defaultdict(int)
              for i in entries:
                  if i.filename.startswith('lib/'):
                      component='native_libraries'
                  elif i.filename.endswith('.dex'):
                      component='dex'
                  elif i.filename == 'resources.arsc':
                      component='resource_table'
                  elif i.filename.startswith('res/'):
                      component='res_resources'
                  else:
                      component='other'
                  components[component] += i.compress_size
          digest=hashlib.sha256()
          with open(apk,'rb') as source:
              for chunk in iter(lambda: source.read(1024*1024), b''):
                  digest.update(chunk)
          apk_bytes=os.path.getsize(apk)
          report={
              'apk': os.path.basename(apk),
              'apk_bytes': apk_bytes,
              'sha256': digest.hexdigest(),
              'abi': abis,
              'baseline_v1_0_7_bytes': 70407516,
              'size_change_vs_v1_0_7_bytes': apk_bytes-70407516,
              'components_compressed_bytes': dict(sorted(components.items())),
          }
          with open('preview-apk-size-profile.json','w') as output:
              json.dump(report,output,indent=2)
              output.write('\n')
          print(json.dumps(report,indent=2))
          PY
          sha256sum "$apk" > "$apk.sha256"

      - name: Retain the verified preview distribution APK and reports
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        uses: actions/upload-artifact@v4
        with:
          name: Nazelha-preview-arm64-distribution
          path: |
            app/build/outputs/apk/githubPreview/distribution/*.apk
            app/build/outputs/apk/githubPreview/distribution/*.sha256
            app/build/outputs/mapping/githubPreviewDistribution/mapping.txt
            preview-verification.txt
            preview-apk-size-profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Build minified signed x86_64 preview for emulator install smoke test
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        env:
          NAZELHA_STORE_PASSWORD: ${{ secrets.NAZELHA_RELEASE_STORE_PASSWORD }}
          NAZELHA_KEY_ALIAS: ${{ secrets.NAZELHA_RELEASE_KEY_ALIAS }}
          NAZELHA_KEY_PASSWORD: ${{ secrets.NAZELHA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAZELHA_STORE_PASSWORD"
          test -n "$NAZELHA_KEY_ALIAS"
          test -n "$NAZELHA_KEY_PASSWORD"
          ./gradlew \
            :app:assembleGithubPreviewDistribution \
            -PnoSplits \
            -PABI_FILTERS=x86_64 \
            -PnazelhaRequirePreviewSigning=true \
            --no-daemon \
            --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify signed x86_64 emulator install candidate
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/githubPreview/distribution -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > x86_64-install-smoke-verification.txt
          debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$apk")
          test "$debuggable" = "false"
          printf 'APK debuggable: %s\n' "$debuggable" >> x86_64-install-smoke-verification.txt
          "$tools/aapt" dump badging "$apk" >> x86_64-install-smoke-verification.txt
          grep -q "package: name='com.snapnet.preview.debug'" x86_64-install-smoke-verification.txt
          grep -q "versionCode='100110404' versionName='1.0.11-preview'" x86_64-install-smoke-verification.txt
          digest_line=$(grep -i -m1 'certificate SHA-256 digest:' x86_64-install-smoke-verification.txt)
          digest=${digest_line#*digest: }
          digest=${digest//:/}
          digest=$(printf '%s' "$digest" | tr '[:upper:]' '[:lower:]')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test "$digest" = "$NAZELHA_EXPECTED_RELEASE_CERT_SHA256"
          printf 'Verified certificate SHA-256 (normalized): %s\n' "$digest" >> x86_64-install-smoke-verification.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
          assert abis == ['x86_64'], abis
          PY
          smoke_apk="$(dirname "$apk")/Nazelha-1.0.11-x86_64-distribution.apk"
          if [[ "$apk" != "$smoke_apk" ]]; then cp -- "$apk" "$smoke_apk"; fi
          sha256sum "$smoke_apk" > "$smoke_apk.sha256"

      - name: Retain x86_64 install-smoke APK (not a release asset)
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        uses: actions/upload-artifact@v4
        with:
          name: Nazelha-preview-x86_64-install-smoke
          path: |
            app/build/outputs/apk/githubPreview/distribution/*x86_64-distribution.apk
            app/build/outputs/apk/githubPreview/distribution/*x86_64-distribution.apk.sha256
            x86_64-install-smoke-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Retain validation reports (never retain branch APKs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nazelha-validation-reports-${{ github.run_number }}
          path: |
            apk-verification.txt
            apk-size-profile.json
            app/build/test-results/testGithubPreviewDebugUnitTest/**/*.xml
            app/build/reports/lint-results-githubPreviewDebug.html
            app/build/reports/lint-results-githubPreviewDebug.xml
            preview-verification.txt
            preview-apk-size-profile.json
            x86_64-install-smoke-verification.txt
          if-no-files-found: warn
          retention-days: 14

  android-tests:
    needs:
      - test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Nazelha
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Download signed preview candidate for install smoke test
        if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
        uses: actions/download-artifact@v4
        with:
          name: Nazelha-preview-x86_64-install-smoke
          path: preview-candidate

      - name: Grant the ephemeral runner access to KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "KVM device is unavailable on this Linux runner" >&2
            exit 1
          fi
          sudo chown "$(id -un)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          stat -c '/dev/kvm owner=%U group=%G mode=%a' /dev/kvm

      - name: Run Android instrumentation tests on API 35
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/run-android-instrumentation.sh

      - name: Retain emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nazelha-emulator-reports-${{ github.run_number }}
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**/*
            android-test-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  publish-preview:
    if: startsWith(github.ref, 'refs/tags/nazelha-preview-v')
    needs:
      - test-and-build
      - android-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified ARM64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Nazelha-preview-arm64-distribution
          path: release-assets

      - name: Flatten and verify APK for release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-assets -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          source_apk="${apks[0]}"
          source_checksum="${source_apk}.sha256"
          test -s "$source_checksum"
          expected_sha="$(awk 'NR == 1 { print $1 }' "$source_checksum")"
          actual_sha="$(sha256sum "$source_apk" | awk 'NR == 1 { print $1 }')"
          test "$expected_sha" = "$actual_sha"
          test -s release-assets/preview-apk-size-profile.json
          test -s release-assets/preview-verification.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" release-assets/preview-verification.txt
          grep -Fxq 'APK debuggable: false' release-assets/preview-verification.txt
          grep -q "package: name='com.snapnet.preview.debug'" release-assets/preview-verification.txt
          grep -q "versionCode='100110402' versionName='1.0.11-preview'" release-assets/preview-verification.txt
          grep -q "application-label:'نزّلها — فيديو وملفات'" release-assets/preview-verification.txt
          grep -Fxq "Verified certificate SHA-256 (normalized): $NAZELHA_EXPECTED_RELEASE_CERT_SHA256" release-assets/preview-verification.txt
          python3 - "$source_apk" release-assets/preview-apk-size-profile.json <<'PY'
          import hashlib, json, os, sys
          apk, report_path = sys.argv[1:]
          with open(report_path, encoding='utf-8') as f:
              report = json.load(f)
          digest = hashlib.sha256()
          with open(apk, 'rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  digest.update(chunk)
          assert report['apk'] == os.path.basename(apk)
          assert report['apk_bytes'] == os.path.getsize(apk)
          assert report['sha256'] == digest.hexdigest()
          assert report['abi'] == ['arm64-v8a']
          PY
          apk_name="$(basename "$source_apk")"
          release_apk="release-assets/$apk_name"
          if [[ "$source_apk" != "$release_apk" ]]; then
            cp -- "$source_apk" "$release_apk"
          fi
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
            sha256sum -c "$apk_name.sha256"
          )

      - name: Publish verified prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nazelha preview ${{ github.ref_name }}
          prerelease: true
          body: |
            **ملاحظة التثبيت:** هذا الإصدار يبدأ مفتاح توقيع Nazelha Preview ثابتًا جديدًا، لذلك لا يقبل التحديث المباشر فوق 1.0.7. صدّر بياناتك المهمة ثم أزل الإصدار 1.0.7 وثبّت هذا الإصدار؛ إزالة التطبيق قد تحذف بياناته المحلية. إصدارات Preview اللاحقة ستستخدم الشهادة نفسها لتحديث هذا الإصدار وما بعده.
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.sha256
            release-assets/preview-verification.txt
            release-assets/preview-apk-size-profile.json

  publish-production:
    if: startsWith(github.ref, 'refs/tags/nazelha-v')
    needs:
      - test-and-build
      - android-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified official ARM64 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Nazelha-official-arm64-release
          path: release-assets

      - name: Recheck official release payload and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-assets -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          source_apk="${apks[0]}"
          source_checksum="${source_apk}.sha256"
          test -s "$source_checksum"
          expected_sha=$(awk 'NR == 1 { print $1 }' "$source_checksum")
          actual_sha=$(sha256sum "$source_apk" | awk 'NR == 1 { print $1 }')
          test "$expected_sha" = "$actual_sha"
          test -s release-assets/official-verification.txt
          test -s release-assets/official-apk-size-profile.json
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" release-assets/official-verification.txt
          grep -Fxq 'APK debuggable: false' release-assets/official-verification.txt
          grep -q "package: name='com.hoodmoshla.nazelha'" release-assets/official-verification.txt
          grep -q "versionCode='100110402' versionName='1.0.11'" release-assets/official-verification.txt
          grep -Fxq "Verified production certificate SHA-256 (normalized): $NAZELHA_EXPECTED_PRODUCTION_CERT_SHA256" release-assets/official-verification.txt
          python3 - "$source_apk" release-assets/official-apk-size-profile.json <<'PY'
          import hashlib, json, os, sys
          apk, report_path = sys.argv[1:]
          with open(report_path, encoding='utf-8') as source:
              report=json.load(source)
          digest=hashlib.sha256()
          with open(apk,'rb') as source:
              for chunk in iter(lambda: source.read(1024*1024), b''):
                  digest.update(chunk)
          assert report['apk'] == os.path.basename(apk)
          assert report['apk_bytes'] == os.path.getsize(apk)
          assert report['sha256'] == digest.hexdigest()
          assert report['abi'] == ['arm64-v8a']
          assert report['application_id'] == 'com.hoodmoshla.nazelha'
          assert report['version_name'] == '1.0.11'
          assert report['version_code'] == 100110402
          PY
          apk_name="$(basename "$source_apk")"
          release_apk="release-assets/$apk_name"
          if [[ "$source_apk" != "$release_apk" ]]; then
            cp -- "$source_apk" "$release_apk"
          fi
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
            sha256sum -c "$apk_name.sha256"
          )

      - name: Publish official stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nazelha 1.0.11 — الإصدار الرسمي
          prerelease: false
          generate_release_notes: true
          body: |
            ## نزّلها 1.0.11 — الإصدار الرسمي

            - الحزمة: `com.hoodmoshla.nazelha` (هوية Nazelha المستقلة).
            - APK لمعمارية `arm64-v8a`، الإصدار `1.0.11`، ورمز الإصدار `100110402`.
            - وُقّع بمفتاح إنتاج مستقل ودائم خاص بـNazelha، واجتاز التحقق الآلي من التوقيع والهوية والبناء والاختبارات.
            - تحسين واجهة المتصفح: تقليل المسافات في شريط العنوان وإبعاد ملاحظة الخصوصية الطويلة عن شاشة التصفح الحي، مع الحفاظ على أدوات المتصفح والتنزيلات وهوية التطبيق.

            **التثبيت:** هذا تطبيق مستقل عن حزمة المعاينة القديمة `com.snapnet.preview.debug`، ويمكن تثبيته بجانبها. لا تُنقل بيانات المعاينة تلقائيًا إلى التطبيق الرسمي.
          files: |
            release-assets/*.apk
            release-assets/*.apk.sha256
            release-assets/official-verification.txt
            release-assets/official-apk-size-profile.json
